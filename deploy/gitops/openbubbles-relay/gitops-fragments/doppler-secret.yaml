# FRAGMENT - append this one object to apps/doppler/dopplersecrets.yaml.
#
# It is not a kustomize resource and is deliberately absent from
# kustomization.yaml: the operator refuses to reconcile a DopplerSecret that
# lives outside its own namespace, which is why every DopplerSecret in the
# cluster sits in that one file next to the operator (its header says so).
#
# Before this exists, create the value in Doppler:
#   project kubernetes, config prd, key OPENBUBBLES_PROFILES_JSON
# whose value is the entire profiles.json as plain text. It is C4: it maps a
# bearer code to a hardware identity, and that code is what authenticates a
# client to the relay. Owner-run only; never committed, echoed or printed.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: openbubbles-relay-profiles
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  # Pinned to the one key. Without that list the operator mirrors the ENTIRE
  # Doppler config into the target namespace.
  secrets: [OPENBUBBLES_PROFILES_JSON]
  processors:
    # asName supplies the mounted filename, the same trick immich-config uses
    # for immich.json. A dot is legal in a Secret key and in a filename.
    OPENBUBBLES_PROFILES_JSON: {asName: profiles.json, type: plain}
  managedSecret:
    name: openbubbles-relay-profiles
    namespace: openbubbles-relay
    type: Opaque
  # Five minutes, matching the rest of that file. The Secret updates quickly,
  # but the relay reads the file once at startup, so this is not by itself a
  # rotation - see the register entry next door.
  resyncSeconds: 300
