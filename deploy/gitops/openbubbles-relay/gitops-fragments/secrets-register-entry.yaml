# FRAGMENT - insert this entry into security/registers/secrets.yaml, in id order
# (S-47 was the highest when this was written).
#
# That register is kind: inventory, not kind: exception, so the entry takes
# effect without the owner's hardware-key signature. The exception registers are
# the ones that need it.
#
# HS-ROT-01 fails CI for any DopplerSecret with no entry here.
#
# reload: manual is the honest value, not auto. The operator can rewrite the
# Secret, but crates/openbubbles-relay/src/main.rs:105-108 reads
# /data/profiles.json exactly once, before the listener binds, and the mount is
# a subPath. A rotation therefore needs a restart:
#   kubectl -n openbubbles-relay rollout restart deploy/openbubbles-relay
# Do not add secrets.doppler.com/reload: "true" to work around that: an
# annotation cannot make a file that is read once be read again.
- id: S-48
  secret: openbubbles-relay/openbubbles-relay-profiles
  keys: [OPENBUBBLES_PROFILES_JSON]
  origin: app-generated
  rotatable: "coupled"
  method: "Minted with the profile by the relay's own probe/get-number tooling, then set in Doppler. Rotating the bearer code also changes what the OpenBubbles client must be configured with, so do both, then restart the Deployment."
  reload: manual
  consumers: [Deployment/openbubbles-relay]
  period_months: 12
  last_rotated: unknown
