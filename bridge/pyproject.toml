[project]
name = "openbubbles-relay-bridge"
version = "0.1.0"
description = "XMPP <-> iMessage bridge for the imessage-server HTTP API"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "aiohttp>=3.9,<4",
    "slixmpp>=1.8,<2",
    "OMEMO>=2.1,<3",
    "Twomemo[xml]>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
